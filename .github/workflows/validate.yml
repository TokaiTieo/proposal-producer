name: Skill contracts and behavior
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify installer and extract payload
        run: |
          python test_install.py
          python install.py --dest "$RUNNER_TEMP/proposal-skills"
      - name: Install validation components
        run: python -m pip install -r "$RUNNER_TEMP/proposal-skills/proposal-producer/requirements.txt"
      - name: Validate contracts and run behavioral cases
        run: |
          python "$RUNNER_TEMP/proposal-skills/proposal-producer/scripts/proposal.py" validate --workdir "$RUNNER_TEMP/validation"
          python -m unittest discover -s "$RUNNER_TEMP/proposal-skills/proposal-producer/scripts" -p 'test_*.py' -v
